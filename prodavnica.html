<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <title>Čokograd - Prodavnica</title>
    <link rel="icon" type="image/png" href="./slike/favicon.png">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header>
    <img src="./slike/logo.png" alt="Čokograd logo" class="logo">
    <h1>Čokograd</h1>
    <p>Grad ručno pravljenih čokolada</p>
</header>

<nav>
    <a href="./index.html">Početna</a>
    <a href="./o-nama.html">O nama</a>
    <a href="./prodavnica.html">Prodavnica</a>
    <a href="./kontakt.html">Kontakt</a>
</nav>

<main>
    <h2>Prodavnica</h2>

    <section class="pretraga-box">
        <label for="pretraga">Pretraži proizvod:</label>
        <input type="text" id="pretraga" placeholder="Unesi naziv čokolade">
        <button id="dugmePretraga">Pretraži</button>
        <button id="dugmePrikaziSve">Prikaži sve</button>
    </section>

    <section id="listaProizvoda" class="proizvodi"></section>

    <section class="forma-box">
        <h2>Forma za poručivanje</h2>

        <form id="formaPorudzbine">
            <label for="ime">Ime i prezime</label>
            <input type="text" id="ime" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="proizvod">Izaberi proizvod</label>
            <select id="proizvod" required></select>

            <label for="kolicina">Količina</label>
            <input type="number" id="kolicina" min="1" value="1" required>

            <label for="placanje">Način plaćanja</label>
            <select id="placanje" required>
                <option value="kartica">Kartica</option>
                <option value="pouzece">Pouzeće</option>
            </select>

            <button type="submit">Pošalji porudžbinu</button>
        </form>

        <div id="poruka" class="poruka"></div>
    </section>
</main>

<footer>
    <p>Designed by Tea © 2025 Čokograd</p>
</footer>

<script src="./js/script.js"></script>
</body>
</html>
